name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: platform_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/platform_dev
      APP_DB_PASSWORD: ci-app-password
      AUTH_LOCAL_SECRET: ci-local-session-secret-at-least-32-chars
      DEMO_PERSONA_SECRET: ci-persona-secret-at-least-32-characters
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: verify (lint, typecheck, migrate, tests, permission + RLS coverage, build)
        run: pnpm verify
      - name: template smoke test (scaffold a tool and run its checks)
        run: pnpm check:template
